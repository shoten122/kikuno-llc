<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同会社喜久野</title>
<style>
  :root {
    --bg: #f7f2e9;
    --surface: #fffdf9;
    --surface-2: #efe6d6;
    --ink: #2a2119;
    --ink-soft: #5c4f42;
    --leather: #8a4a2a;
    --leather-deep: #5c3018;
    --stitch: #b98a4e;
    --line: #ddd0b8;
    --font-display: "Fraunces", "Hiragino Mincho ProN", serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1611;
      --surface: #241c16;
      --surface-2: #2f251d;
      --ink: #efe4d4;
      --ink-soft: #c2b09a;
      --leather: #d38a52;
      --leather-deep: #e8a66b;
      --stitch: #8a6a3e;
      --line: #3c3126;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1611;
    --surface: #241c16;
    --surface-2: #2f251d;
    --ink: #efe4d4;
    --ink-soft: #c2b09a;
    --leather: #d38a52;
    --leather-deep: #e8a66b;
    --stitch: #8a6a3e;
    --line: #3c3126;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    margin: 0;
    padding-inline: 0;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
  .wrap { max-width: 1040px; margin-inline: auto; padding-inline: 24px; }
  section { padding-block: 72px; }

  /* header */
  header.site {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-block: 16px;
    flex-wrap: wrap;
  }
  .brand {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand .kind { font-family: var(--font-body); font-size: 0.68rem; font-weight: 500; color: var(--ink-soft); letter-spacing: 0.08em; }
  nav.links { display: flex; gap: 28px; font-size: 0.92rem; }
  nav.links a { text-decoration: none; color: var(--ink-soft); border-bottom: 1px solid transparent; padding-bottom: 2px; }
  nav.links a:hover, nav.links a:focus-visible { color: var(--leather); border-color: var(--leather); }

  /* hero */
  .hero { padding-block: 88px 56px; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.76rem;
    letter-spacing: 0.18em;
    color: var(--leather);
    font-weight: 600;
    margin-bottom: 22px;
  }
  .eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--leather); display: inline-block; }
  .hero h1 {
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    line-height: 1.28;
    max-width: 15ch;
  }
  .hero .lede {
    margin-top: 26px;
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }
  .hero .cta {
    margin-top: 36px;
    display: inline-flex;
    gap: 14px;
    align-items: center;
  }
  .btn {
    display: inline-block;
    background: var(--leather);
    color: #fff8ef;
    text-decoration: none;
    padding: 13px 26px;
    border-radius: 3px;
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    transition: background 0.15s ease;
  }
  .btn:hover, .btn:focus-visible { background: var(--leather-deep); }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn.ghost:hover { border-color: var(--leather); color: var(--leather); }

  /* stitch divider */
  .stitch {
    width: 100%;
    height: 18px;
    display: block;
  }
  .stitch path { stroke: var(--stitch); stroke-width: 2; stroke-dasharray: 7 8; fill: none; stroke-linecap: round; }

  /* services */
  .section-head { max-width: 56ch; margin-bottom: 44px; }
  .section-head .eyebrow { margin-bottom: 14px; }
  .section-head h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
  .section-head p { color: var(--ink-soft); margin-top: 14px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .card {
    background: var(--surface);
    padding: 30px 26px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card .num { font-family: var(--font-display); font-size: 0.85rem; color: var(--leather); font-variant-numeric: tabular-nums; }
  .card h3 { font-size: 1.08rem; }
  .card p { color: var(--ink-soft); font-size: 0.94rem; margin: 0; }
  .card .tag {
    margin-top: auto;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--stitch);
    border: 1px solid var(--line);
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    width: fit-content;
  }

  /* profile */
  .profile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .profile-row {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 8px 24px;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-row dt { color: var(--ink-soft); font-size: 0.86rem; letter-spacing: 0.02em; }
  .profile-row dd { margin: 0; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) {
    .profile-row { grid-template-columns: 1fr; gap: 4px; }
  }

  /* contact */
  .contact-panel {
    background: var(--leather-deep);
    color: #fbf1e4;
    border-radius: 6px;
    padding: 48px 40px;
    display: grid;
    gap: 28px;
    grid-template-columns: 1.1fr 1fr;
  }
  @media (max-width: 700px) { .contact-panel { grid-template-columns: 1fr; padding: 34px 24px; } }
  .contact-panel h2 { font-size: 1.5rem; color: #fff8ef; }
  .contact-panel p { color: #f1ddc4; margin-top: 12px; max-width: 40ch; }
  .contact-fields { display: flex; flex-direction: column; gap: 16px; align-self: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field .label { font-size: 0.72rem; letter-spacing: 0.08em; color: #e8c79a; }
  .field .value { font-size: 1rem; }
  .field .value.placeholder { color: #e8c79a; font-style: italic; }
  .note {
    font-size: 0.78rem;
    color: #e8c79a;
    border-top: 1px dashed rgba(251, 241, 228, 0.35);
    padding-top: 14px;
    margin-top: 4px;
  }

  footer.site {
    border-top: 1px solid var(--line);
    padding-block: 28px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .craft-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
  }
  .craft-gallery figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .craft-gallery img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    display: block;
  }
  .craft-gallery figcaption {
    padding: 14px 18px;
    font-size: 0.86rem;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
  }
</style>
